# Omisiones del piloto. El check estatico sigue fallando por cualquier
# otro chequeo. No cubren el catálogo (CIS de red, IAM, auditoría ni
# buckets públicos). Reabrirlas si el socio pide cifrado con llaves propias.
#
# No se usa un módulo de KMS: estos chequeos piden llaves que el cliente
# administra (CSEK) o un registro de accesos y una subred IPv6 que el MVP
# no demuestra. El bootstrap ya está aplicado, el presupuesto de la prueba
# gratuita es de 1000 MXN y quedan 3 semanas. Un anillo de KMS no apaga
# CKV_GCP_62 ni CKV_GCP_76, y cifrar de nuevo BigQuery, Pub/Sub y Artifact
# Registry obligaría a recrear recursos que ya existen.

