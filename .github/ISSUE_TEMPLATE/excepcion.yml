name: Solicitud de excepción
description: Pedir que un recurso quede exento de un control por tiempo limitado (HU-11, Could)
title: "Excepción: CTL-XXX en "
labels: ["excepcion"]
body:
  - type: markdown
    attributes:
      value: |
        Una excepción aprobada se registra con un PR a `policies/catalog/exceptions.yaml`, siempre con fecha de vencimiento. Solo Cumplimiento la aprueba y, al vencer, deja de aplicar.
  - type: input
    id: control
    attributes:
      label: Control
      placeholder: CTL-RED-01
    validations:
      required: true
  - type: input
    id: recurso
    attributes:
      label: Recurso (dirección de Terraform)
      placeholder: google_compute_firewall.admin
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - dev
        - qa
        - prod
    validations:
      required: true
  - type: textarea
    id: justificacion
    attributes:
      label: Justificación
      description: Por qué no se puede cumplir el control por ahora.
    validations:
      required: true
  - type: textarea
    id: medida
    attributes:
      label: Medida compensatoria
      description: Qué reduce el riesgo mientras dure la excepción.
    validations:
      required: true
  - type: input
    id: vence
    attributes:
      label: Fecha de vencimiento (AAAA-MM-DD)
    validations:
      required: true
  - type: input
    id: aprobador
    attributes:
      label: Responsable de Cumplimiento que aprueba
    validations:
      required: true
