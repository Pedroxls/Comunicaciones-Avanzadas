# Validación de cada Pull Request hacia main (HU-01).
# Marca como obligatorios en la protección de main: estatico, politicas, secretos y cumplimiento.
# GitHub solo carga workflows de la raíz. El código está en equipo3-cumplimiento-gcp/.
name: pr-validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: equipo3-cumplimiento-gcp

env:
  TF_VERSION: "1.9.8"
  CONFTEST_VERSION: "0.55.0"

jobs:
  estatico:
    name: estatico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: terraform validate (cada carpeta con .tf)
        run: |
          for d in $(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: terraform test (módulo de red)
        run: terraform -chdir=infra/modules/network test

      - name: Checkov (chequeos CIS sobre el código)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: equipo3-cumplimiento-gcp/infra
          framework: terraform
          quiet: true

  politicas:
    name: politicas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: opa fmt (sin cambios pendientes)
        run: opa fmt --fail --list policies

      - name: opa test (un caso que pasa y uno que falla por política)
        run: opa test policies -v

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pytest de evidencia, drift, agente y freno
        run: |
          python -m pip install --quiet pytest
          python -m pytest services/evidence/tests sensors/drift/tests agent/tests infra/bootstrap/killswitch -q

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cumplimiento:
    name: cumplimiento
    needs: politicas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: sin llaves JSON
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Aviso mientras no exista la federación de identidad
        if: ${{ vars.GCP_WIF_PROVIDER == '' }}
        run: echo "::notice::Falta configurar GCP_WIF_PROVIDER, GCP_PLAN_SA y GCP_PROJECT_ID (HU-07). El plan contra GCP se omite; el fixture de Telnet sí se evalúa."

      - name: Instalar Conftest
        run: |
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz conftest
          sudo mv conftest /usr/local/bin/

      - name: El plan con Telnet abierto produce CTL-RED-04
        run: sh gate/fixtures/comprobar_gate.sh

      - uses: google-github-actions/auth@v2
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v3
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Plan de dev en JSON
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        working-directory: equipo3-cumplimiento-gcp/infra/environments/dev
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform init -input=false
          terraform plan -input=false -lock=false -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Infracost
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "::notice::Falta INFRACOST_API_KEY. Se omite el costo del PR."
            exit 0
          fi
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
          infracost breakdown --path infra/environments/dev/plan.json --format table

      - name: Conftest del plan real
        id: plan
        env:
          MODO_POLITICAS: ${{ vars.MODO_POLITICAS }}
          AGENTE_URL: ${{ vars.AGENTE_URL }}
        run: sh gate/evaluar_plan.sh
        continue-on-error: true

      - name: Comentario en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'equipo3-cumplimiento-gcp/veredicto.md';
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: El modo bloqueo falla el check
        if: steps.plan.outcome == 'failure'
        run: exit 1
